<body>
  <div id="app"></div>
  <div id="errbox" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7a0000;color:#fff;padding:12px;font-family:monospace;font-size:12px;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap"></div>
  <script>
  window.addEventListener('error', e => {
    const b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent += 'ERROR: ' + (e.message || e.error) + '
' + (e.filename || '') + ':' + (e.lineno || '') + '
';
  });
  window.addEventListener('unhandledrejection', e => {
    const b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent += 'PROMISE ERROR: ' + (e.reason && e.reason.message || e.reason) + '
';
  });
  </script>
  <div id="toasts"></div>
  <script type="module" src="/js/app.js?v=14e1a39"></script>
</body>
</html>
